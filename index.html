<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
            <h1 class="title">Антошка саси пенис 😎</h1>
            <img id="random-img" class="random-image" src="">
            <script>
            async function loadRandomBackground() {
                try {
                    // Запрос к аниме-API
                    const response = await fetch('https://nekos.best/api/v2/shoot');
                    const data = await response.json();
                    
                    // Устанавливаем полученную картинку как фон для body
                    document.body.style.backgroundImage = `url('${data.results[0].url}')`;
                } catch (error) {
                    console.error("Не удалось загрузить фоновый шедевр:", error);
                }
            }
            // Запуск при загрузке страницы
            loadRandomBackground();
        </script>
    </div>
</body>
</html>
